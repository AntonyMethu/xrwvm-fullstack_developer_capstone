services:
  mongo_db:
    container_name: db_container
    image: mongo:latest
    command: ["mongod", "--bind_ip_all"]
    ports:
      - "27017:27017"
    restart: always
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    image: nodeapp
    ports:
      - "3030:3030"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: 
      - mongo_db

volumes:
  mongo_data: {}